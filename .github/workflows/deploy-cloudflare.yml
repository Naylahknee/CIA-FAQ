name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
      SUPPORT_PAYMENT_URL: ${{ vars.SUPPORT_PAYMENT_URL }}
      SUPPORT_CONFIRMED_TOTAL_CENTS: ${{ vars.SUPPORT_CONFIRMED_TOTAL_CENTS }}
      SUPPORT_GOAL_CENTS: ${{ vars.SUPPORT_GOAL_CENTS }}
      AUTH_ENCRYPTION_KEY: ${{ secrets.AUTH_ENCRYPTION_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      GROUPME_WEBHOOK_SECRET: ${{ secrets.GROUPME_WEBHOOK_SECRET }}
      GROUPME_GROUP_ID: ${{ secrets.GROUPME_GROUP_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Restore script permissions
        run: chmod +x scripts/*.sh
      - run: npm run build
      - name: Finalize Cloudflare configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "dist/server/wrangler.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          const databaseId = process.env.CLOUDFLARE_D1_DATABASE_ID?.trim();
          if (!databaseId || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(databaseId)) {
            throw new Error("CLOUDFLARE_D1_DATABASE_ID is not a valid D1 UUID.");
          }
          config.name = "cia-guide";
          config.d1_databases = (config.d1_databases ?? []).map((binding) => ({
            ...binding,
            database_name: process.env.CLOUDFLARE_D1_DATABASE_NAME,
            database_id: databaseId,
          }));
          config.r2_buckets = (config.r2_buckets ?? []).map((binding) => ({
            ...binding,
            bucket_name: process.env.CLOUDFLARE_R2_BUCKET_NAME,
          }));
          config.vars = { ...(config.vars ?? {}) };
          const appOrigin = process.env.APP_ORIGIN?.trim() || "https://ciaquestions.com";
          const appUrl = new URL(appOrigin);
          if (appUrl.protocol !== "https:" || appUrl.pathname !== "/" || appUrl.search || appUrl.hash) {
            throw new Error("APP_ORIGIN must be an HTTPS origin without a path, query, or fragment.");
          }
          config.vars.APP_ORIGIN = appUrl.origin;
          const apexHostname = appUrl.hostname.startsWith("www.") ? appUrl.hostname.slice(4) : appUrl.hostname;
          const customDomains = [apexHostname, `www.${apexHostname}`];
          const existingNonCustomRoutes = (config.routes ?? []).filter((route) => !route.custom_domain);
          config.routes = [
            ...existingNonCustomRoutes,
            ...customDomains.map((pattern) => ({ pattern, custom_domain: true })),
          ];
          if (process.env.AUTH_EMAIL_FROM?.trim()) config.vars.AUTH_EMAIL_FROM = process.env.AUTH_EMAIL_FROM.trim();
          if (process.env.GOOGLE_CLIENT_ID?.trim()) config.vars.GOOGLE_CLIENT_ID = process.env.GOOGLE_CLIENT_ID.trim();
          if (/^[1-9][0-9]*$/.test(process.env.SUPPORT_GOAL_CENTS?.trim() ?? "")) config.vars.SUPPORT_GOAL_CENTS = process.env.SUPPORT_GOAL_CENTS.trim();
          if (process.env.SUPPORT_PAYMENT_URL?.trim()) config.vars.SUPPORT_PAYMENT_URL = process.env.SUPPORT_PAYMENT_URL.trim();
          if (/^[0-9]+$/.test(process.env.SUPPORT_CONFIRMED_TOTAL_CENTS?.trim() ?? "")) config.vars.SUPPORT_CONFIRMED_TOTAL_CENTS = process.env.SUPPORT_CONFIRMED_TOTAL_CENTS.trim();
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE
      - name: Package D1 migrations
        run: cp -R drizzle dist/server/migrations
      - name: Apply D1 database migrations
        run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
      - name: Apply Neon authentication migration
        if: ${{ env.DATABASE_URL != '' }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/neon/0001_auth.sql
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
      - name: Configure two-factor encryption secret
        if: ${{ env.AUTH_ENCRYPTION_KEY != '' }}
        run: printf '%s' "$AUTH_ENCRYPTION_KEY" | npx wrangler secret put AUTH_ENCRYPTION_KEY --config dist/server/wrangler.json
      - name: Configure transactional email secret
        if: ${{ env.RESEND_API_KEY != '' }}
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config dist/server/wrangler.json
      - name: Configure Neon database secret
        if: ${{ env.DATABASE_URL != '' }}
        run: printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL --config dist/server/wrangler.json
      - name: Configure GroupMe callback secret
        if: ${{ env.GROUPME_WEBHOOK_SECRET != '' }}
        run: printf '%s' "$GROUPME_WEBHOOK_SECRET" | npx wrangler secret put GROUPME_WEBHOOK_SECRET --config dist/server/wrangler.json
      - name: Configure owner email
        if: ${{ env.ADMIN_EMAIL != '' }}
        run: printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL --config dist/server/wrangler.json
      - name: Configure allowed GroupMe group
        if: ${{ env.GROUPME_GROUP_ID != '' }}
        run: printf '%s' "$GROUPME_GROUP_ID" | npx wrangler secret put GROUPME_GROUP_ID --config dist/server/wrangler.json
